<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Temporary page: keep search engines from indexing it. Remove when going live. -->
  <meta name="robots" content="noindex, nofollow" />
  <title>The Age of Intelligence — Coming Soon</title>

  <!-- Preload the hero image for faster first paint -->
  <link rel="preload" as="image" href="images/landing-pryamid.webp" />

  <style>
    /* --- Basic reset & layout --- */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #1b140c;       /* warm tone to match the image edges */
      display: grid;
      place-items: center;
      overflow: hidden;           /* prevents stray scrollbars on mobile */
    }

    /* A full-viewport frame that centers its content */
    main {
      inline-size: 100vw;
      block-size: 100vh;
      block-size: 100svh;         /* mobile-safe viewport height */
      display: grid;
      place-items: center;
    }

    /* The image scales to fit while preserving aspect ratio */
    img.hero {
      display: block;
      max-inline-size: 100%;
      max-block-size: 100%;
      width: auto;                /* let the browser preserve aspect ratio */
      height: auto;
      object-fit: contain;        /* keep entire image visible (no cropping) */
      object-position: center;
    }

    /* If you want full-bleed cropping instead, use:
       img.hero { object-fit: cover; width: 100%; height: 100%; }
    */
  </style>
</head>
<body>
  <main>
    <!-- Put your image at /images/landing.webp or update the path below. -->
    <!-- Width/height keep the correct aspect ratio and reduce layout shift. -->
    <img
      class="hero"
      src="images/landing-pryamid.webp"
      width="1536" height="1024"
      alt="A person stands at a sunset crossroads, with a city to the left and a winding path to the right."
      fetchpriority="high"
      decoding="async"
    />
  </main>
</body>
</html>
